[package]
name = "autorig"
version = "0.1.0"
edition = "2024"
description = "Character import, automatic humanoid rigging (marker fit + voxel geodesic skin weights) and animation retargeting"
license = "MIT"

[dependencies]
glam = { version = "0.33", features = ["serde"] }
gltf = { version = "1.4.1", default-features = false, features = ["import", "names", "utils", "KHR_materials_emissive_strength", "KHR_texture_transform"] }
ufbx = "0.11.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
